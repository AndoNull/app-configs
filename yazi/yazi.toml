[opener]
# IMPORTANTE: nvim necesita 'block = true' porque vive en la terminal
nvim = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" }
]

pdf = [
    { run = 'zathura "$@"', orphan = true, desc = "Zathura" }
]

view_image = [
    { run = 'nohup qview "$@" >/dev/null 2>&1 &', orphan = true, desc = "Abrir con qView" }
]

play = [
    { run = 'mpv "$@"', orphan = true, desc = "MPV" }
]

[open]
rules = [
    { mime = "text/*", use = "nvim" },
    { mime = "application/json", use = "nvim" },
    { mime = "application/toml", use = "nvim" },
    { mime = "application/x-shellscript", use = "nvim" },
    { mime = "*.pdf", use = "pdf" },           # <-- esto también está mal
    { mime = "application/pdf", use = "pdf" },
    { mime = "image/*", use = "view_image" },
    { mime = "{video,audio}/*", use = "play" },
]  

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "mime"
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
id    = "mime"
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"

[[plugin.prepend_previewers]]
url = "*.csv"
run = "rich-preview"

[[plugin.prepend_previewers]]
url = "*.md"
run = "rich-preview"

[[plugin.prepend_previewers]]
url = "*.rst"
run = "rich-preview"

[[plugin.prepend_previewers]]
url = "*.ipynb"
run = "rich-preview"

[[plugin.prepend_previewers]]
url = "*.json"
run = "rich-preview"

[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"

[[plugin.prepend_previewers]]
mime = "*executable*"
run  = "exiftool"

[[plugin.prepend_preloaders]]
mime = "{audio,video,image}/*"
run  = "mediainfo"

[[plugin.prepend_preloaders]]
mime = "application/subrip"
run  = "mediainfo"

[[plugin.prepend_preloaders]]
mime = "{image}/*"
