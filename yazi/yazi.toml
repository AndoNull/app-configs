[tasks]
image_alloc = 1073741824


[[plugin.prepend_fetchers]]
id    = "simple-tag"
url   = "*"
run   = "simple-tag"
group = "simple-tag"

[[plugin.prepend_fetchers]]
id    = "simple-tag"
url   = "*/"
run   = "simple-tag"
group = "simple-tag"

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
